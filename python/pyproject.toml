[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ntropix-file-service"
version = "1.0.0"
description = "SDK de Python del File Service de ntropix: subir, consultar y servir archivos desde el backend de un proyecto."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ntropix" }]
keywords = ["ntropix", "file-service", "upload", "storage", "s3", "presigned-url"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/marcanii/file-service"

[tool.hatch.build.targets.wheel]
packages = ["src/ntropix_file_service"]

[tool.hatch.build.targets.sdist]
include = ["src/ntropix_file_service", "tests", "README.md", "pyproject.toml"]
